[shim]
target = "gleam_stdlib"
version = ">= 1.0.0 and < 2.0.0"

# =============================================================================
# Direct Builtin / Prelude Type Aliases
# =============================================================================

[type_overrides."gleam_stdlib:gleam/dynamic.Dynamic"]
package = "gprelude"
type = "Dynamic"

[type_overrides."gleam_stdlib:gleam/option.Option"]
package = "builtin"
type = "Option"

# =============================================================================
# Co-Located Module Patches
# =============================================================================

[patch."gleam_stdlib:gleam/bit_array"]
file = "patches/gleam/bit_array.mbt"
imports = ["moonbitlang/core/buffer", "moonbitlang/core/encoding/utf8"]
functions = [
  "from_string",
  "bit_size",
  "byte_size",
  "pad_to_bytes",
  "slice",
  "is_utf8",
  "to_string",
  "concat",
  "base64_encode",
  "decode64",
  "base16_encode",
  "base16_decode",
  "inspect",
  "compare",
  "starts_with",
]

[patch."gleam_stdlib:gleam/dict"]
file = "patches/gleam/dict.mbt"
types = ["Dict", "TransientDict"]
functions = [
  "to_transient",
  "from_transient",
  "size",
  "has_key",
  "new",
  "get",
  "do_insert",
  "transient_insert",
  "map_values",
  "transient_delete",
  "fold",
  "transient_update_with",
]

[patch."gleam_stdlib:gleam/dynamic"]
file = "patches/gleam/dynamic.mbt"
functions = [
  "classify",
  "bool",
  "string",
  "float",
  "int",
  "bit_array",
  "list",
  "array",
  "properties",
  "nil",
]

[patch."gleam_stdlib:gleam/dynamic/decode"]
file = "patches/gleam/dynamic/decode.mbt"
imports = ["gleam/dict", "gleam/dynamic"]
functions = [
  "lookup_field",
  "key_to_string",
  "decode_string",
  "decode_bool",
  "decode_int",
  "decode_float",
  "decode_bit_array",
  "list",
  "decode_dict",
  "is_null",
]

[patch."gleam_stdlib:gleam/float"]
file = "patches/gleam/float.mbt"
imports = [
  "moonbitlang/core/double as dbl",
  "moonbitlang/core/math",
  "moonbitlang/core/random",
  "moonbitlang/core/string as str",
]
functions = [
  "parse",
  "to_string",
  "ceiling",
  "floor",
  "round",
  "truncate",
  "do_to_float",
  "do_power",
  "random",
  "do_log",
  "exponential",
]

[patch."gleam_stdlib:gleam/int"]
file = "patches/gleam/int.mbt"
imports = ["moonbitlang/core/string as str"]
functions = [
  "parse",
  "do_base_parse",
  "to_string",
  "do_to_base_string",
  "to_float",
  "bitwise_and",
  "bitwise_not",
  "bitwise_or",
  "bitwise_exclusive_or",
  "bitwise_shift_left",
  "bitwise_shift_right",
]

[patch."gleam_stdlib:gleam/io"]
file = "patches/gleam/io.mbt"
functions = ["print", "print_error", "println", "println_error"]

[patch."gleam_stdlib:gleam/string"]
file = "patches/gleam/string.mbt"
imports = [
  "gleam/string_tree",
  "moonbitlang/core/buffer",
  "moonbitlang/core/encoding/utf8",
]
functions = [
  "length",
  "lowercase",
  "uppercase",
  "less_than",
  "grapheme_slice",
  "unsafe_byte_slice",
  "crop",
  "contains",
  "starts_with",
  "ends_with",
  "split_once",
  "trim",
  "trim_start",
  "trim_end",
  "pop_grapheme",
  "unsafe_int_to_utf_codepoint",
  "to_utf_codepoints",
  "from_utf_codepoints",
  "utf_codepoint_to_int",
  "do_inspect",
  "byte_size",
  "remove_prefix",
  "remove_suffix",
]

[patch."gleam_stdlib:gleam/string_tree"]
file = "patches/gleam/string_tree.mbt"
imports = ["moonbitlang/core/encoding/utf8"]
types = ["StringTree"]
functions = [
  "append_tree",
  "from_strings",
  "concat",
  "from_string",
  "to_string",
  "byte_size",
  "lowercase",
  "uppercase",
  "do_to_graphemes",
  "split",
  "replace",
]

[patch."gleam_stdlib:gleam/uri"]
file = "patches/gleam/uri.mbt"
imports = ["moonbitlang/core/buffer", "moonbitlang/core/encoding/utf8"]
functions = [
  "pop_codeunit",
  "codeunit_slice",
  "parse_query",
  "percent_encode",
  "percent_decode",
]
