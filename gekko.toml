[shim]
target = "gleam_stdlib"
version = ">= 1.0.0 and < 2.0.0"

# =============================================================================
# External Type Overrides
# =============================================================================

[type_overrides."gleam_stdlib:gleam/dict.Dict"]
package = "gleam_stdlib_ffi"
type = "Dict"

[type_overrides."gleam_stdlib:gleam/dict.TransientDict"]
package = "gleam_stdlib_ffi"
type = "TransientDict"

[type_overrides."gleam_stdlib:gleam/dynamic.Dynamic"]
package = "gprelude"
type = "Dynamic"

[type_overrides."gleam_stdlib:gleam/option.Option"]
package = "builtin"
type = "Option"

[type_overrides."gleam_stdlib:gleam/string_tree.StringTree"]
package = "gleam_stdlib_ffi"
type = "StringTree"

# =============================================================================
# In-Package Injections (avoids circular MoonBit dependencies)
# =============================================================================

[module_inject."gleam_stdlib:gleam/dynamic/decode"]
files = ["overlays/gleam_dynamic_decode_patch.mbt"]
imports = ["gleam_stdlib_ffi", "gprelude"]

[overrides."gleam_stdlib:gleam/dynamic/decode.list"]
in_package = "__shim_list"

